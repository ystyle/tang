[dependencies]
  "tang" = "2.1.1"
  "tang_ext_crypto" = "2.1.1"

[package]
  cjc-version = "1.2.0"
  name = "middleware_showcase"
  version = "0.1.0"
  description = "中间件功能展示"
  output-type = "executable"
  src-dir = "src"
  compile-option = "-O2 -Woff unused"

[target.x86_64-unknown-linux-gnu]
  link-option = "-L${CANGJIE_STDX_PATH}"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
