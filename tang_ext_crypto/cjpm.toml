[dependencies]
  "tang" = "2.1.1"

[package]
  cjc-version = "1.2.0"
  name = "tang_ext_crypto"
  version = "2.1.1"
  description = "tang 的加密相关中间件：csrf / session / encryptcookie / etag / idempotency（依赖 stdx.crypto）"
  output-type = "static"
  src-dir = "src"
  compile-option = "-O2 -Woff unused"
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/tang"
  include = ["/src", "/LICENSE"]
  exclude = ["/target"]

[target.x86_64-unknown-linux-gnu]
  link-option = "-L${CANGJIE_STDX_PATH}"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
