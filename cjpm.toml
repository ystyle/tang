[workspace]
  members = ["tang", "tang_ext_json_seajson", "tang_ext_crypto", "tang_ext_stdx", "examples/all_method", "examples/app_demo", "examples/banner_test", "examples/basic", "examples/basicauth", "examples/bind_query", "examples/http_demo", "examples/json", "examples/middleware_showcase", "examples/path_params", "examples/todo", "examples/websocket"]
  build-members = ["tang", "tang_ext_json_seajson", "tang_ext_crypto", "tang_ext_stdx", "examples/all_method", "examples/app_demo", "examples/banner_test", "examples/basic", "examples/basicauth", "examples/bind_query", "examples/http_demo", "examples/json", "examples/middleware_showcase", "examples/path_params", "examples/todo", "examples/websocket"]
  test-members = ["tang", "tang_ext_stdx"]

# stdx 只在扩展成员里用（crypto / stdx 兼容层）。核心与 JSON 成员零 stdx，
# 但 workspace 模式下 target 级配置要在根上声明，成员才能解析到 stdx 的 .cjo。
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-unknown-linux-gnu]
  link-option = "-L${CANGJIE_STDX_PATH}"
