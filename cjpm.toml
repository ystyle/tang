[dependencies]
  "sonyflake" = "1.0.9"
  "opencj::multipart" = "0.1.3"
  "cjpminfo" = "1.2.0"

[package]
  cjc-version = "1.1.0"
  compile-option = "-O2 -Woff unused"
  description = "一个轻量级的web框架"
  link-option = ""
  name = "tang"
  output-type = "static"
  src-dir = "src"
  target-dir = ""
  version = "1.0.5"
  # 制品清单（include/exclude 用 gitignore 风格的模式）：
  #   带：src/**（含 *_test.cj）+ README/LICENSE/cjpm.toml
  #   不带：docs/（设计文档）、examples/（独立示例工程）、scripts/、target/
  # 只有 exclude 能挡住目录：include 不写会整棵工作树打包，写了也不等于白名单。
  include = ["src", "LICENSE"]
  exclude = ["/docs", "/examples", "/scripts", "/target", "AGENTS.md"]
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/tang"

[target.x86_64-unknown-linux-gnu]
  # stdx.net.http 的静态库引用 SHA1（WS accept-key）→ 单测链接需要 digest，
  # 否则报 undefined reference to `DYN_SHA1` / MallocDynMsg / FreeDynMsg。
  # 只放 target 级：package 级会传染宏包链接（见 cjxt/AGENTS.md 同款记录）。
  link-option = "-L${CANGJIE_STDX_PATH} -lstdx.crypto.digest"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[profile.build]
incremental = false
