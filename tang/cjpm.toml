[dependencies]
  "ystyle::tachyon" = "0.2.1"
  "opencj::multipart" = "0.1.3"
  "cjpminfo" = "1.2.1"

[package]
  cjc-version = "1.2.0"
  compile-option = "-O2 -Woff unused"
  description = "一个轻量级的web框架：零 stdx 核心，HTTP 层基于 tachyon"
  link-option = ""
  name = "tang"
  output-type = "static"
  src-dir = "src"
  target-dir = ""
  version = "2.1.1"
  # 制品清单（include/exclude 用 gitignore 风格，锚定写法）：
  #   带：src/**（含 *_test.cj）+ LICENSE；README/cjpm.toml 恒定打包
  #   不带：docs/、examples/、scripts/、bench/、AGENTS.md、target/
  include = ["/src", "/LICENSE"]
  exclude = ["/docs", "/examples", "/scripts", "/bench", "/target", "AGENTS.md"]
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/tang"

# 注意：本成员已不含任何 stdx 配置。历史上这里有 -lstdx.crypto.digest
# （stdx.net.http 的 WS accept-key 需要），换成 tachyon 后不再需要；
# 留着会把 ${CANGJIE_STDX_PATH} 传染给所有下游。

[profile.build]
incremental = false
