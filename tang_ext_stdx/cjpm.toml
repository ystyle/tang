[dependencies]
  "tang" = "2.1.0"
  "ystyle::tachyon" = "0.1.0"

[package]
  cjc-version = "1.2.0"
  name = "tang_ext_stdx"
  version = "2.1.0"
  description = "tang 的 stdx 兼容层：把 tang 应用跑在 stdx server 上，复用 stdx 风格的 handler"
  output-type = "static"
  src-dir = "src"
  compile-option = "-O2 -Woff unused"
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/tang"
  include = ["/src", "/LICENSE"]
  exclude = ["/target"]

[target.x86_64-unknown-linux-gnu]
  link-option = "-L${CANGJIE_STDX_PATH}"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
